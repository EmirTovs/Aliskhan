services:
  db:
    image: postgres:16-alpine
    container_name: candleflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: candleflow
      POSTGRES_USER: candleflow
      POSTGRES_PASSWORD: candleflow_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candleflow -d candleflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: candleflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
